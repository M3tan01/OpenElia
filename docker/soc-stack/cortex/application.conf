# Cortex config — wiring adapted from
# _vendor/thehive-templates-src/docker/thehive4-berkleydb-cortex31/vol/cortex/application.conf
# Secret key comes from the environment, not a hardcoded literal.

play.http.secret.key = ${?CORTEX_SECRET_KEY}

search {
  index = cortex
  uri = "http://elasticsearch-cortex:9200"
}

cache.job = 10 minutes

job {
  runner = [docker, process]
}

analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]
}

responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]
}
